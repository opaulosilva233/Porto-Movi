name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend (Laravel / PHP 8.3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app_database_test
          MYSQL_USER: app_user
          MYSQL_PASSWORD: secret_password
          MYSQL_ROOT_PASSWORD: root_secret_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Backend exists
        id: check_backend
        run: |
          if [ -f backend/composer.json ]; then
            echo "backend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "backend_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::backend/composer.json não encontrado. Ignorando validações do backend."
          fi

      - name: Setup PHP 8.3
        if: steps.check_backend.outputs.backend_exists == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip
          coverage: none

      - name: Cache Composer Dependencies
        if: steps.check_backend.outputs.backend_exists == 'true'
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.json', 'backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        if: steps.check_backend.outputs.backend_exists == 'true'
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        if: steps.check_backend.outputs.backend_exists == 'true'
        working-directory: backend
        run: |
          if [ -f ../.env.example ]; then
            cp ../.env.example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_database_test
          DB_USERNAME: app_user
          DB_PASSWORD: secret_password

      - name: Run Database Migrations
        if: steps.check_backend.outputs.backend_exists == 'true'
        working-directory: backend
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_database_test
          DB_USERNAME: app_user
          DB_PASSWORD: secret_password

      - name: Run Pint Linter
        if: steps.check_backend.outputs.backend_exists == 'true'
        working-directory: backend
        run: |
          if [ -f vendor/bin/pint ]; then
            ./vendor/bin/pint --test
          fi

      - name: Run Backend Tests
        if: steps.check_backend.outputs.backend_exists == 'true'
        working-directory: backend
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app_database_test
          DB_USERNAME: app_user
          DB_PASSWORD: secret_password

  frontend-tests:
    name: Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Frontend exists
        id: check_frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
            echo "::notice::frontend/package.json não encontrado. Ignorando validações do frontend."
          fi

      - name: Setup Node.js 20
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Linter & Tests
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Validate TypeScript & Production Build
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        working-directory: frontend
        run: npm run build
