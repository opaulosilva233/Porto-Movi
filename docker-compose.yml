services:
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        USER: laravel
        UID: 1000
    container_name: ${COMPOSE_PROJECT_NAME:-starter_template}_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      # Share the project environment with Laravel. The setup creates this file
      # before starting the containers, and Artisan writes APP_KEY back to it.
      - ./.env:/var/www/backend/.env
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-app_database}
      - DB_USERNAME=${DB_USERNAME:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-starter_template}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

  frontend:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-starter_template}_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
      - VITE_APP_NAME=${VITE_APP_NAME:-Web Project Template}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-starter_template}_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app_database}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-starter_template}_db_data
    driver: local

networks:
  app-net:
    name: ${COMPOSE_PROJECT_NAME:-starter_template}_net
    driver: bridge
